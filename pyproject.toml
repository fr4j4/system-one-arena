[project]
name = "system-one-arena"
version = "0.1.0"
description = "An observable real-time decision laboratory for Laya, Jev and other models"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "numpy>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
laya = ["laya==0.3.4", "torch==2.7.1", "transformers==4.57.6"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/arena"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests_combat"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
